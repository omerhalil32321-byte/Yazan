<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chicken Road - لعبة الدجاجة</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',Tahoma,sans-serif; background:#0d0d1a; color:#fff; min-height:100vh; overflow-x:hidden; }

.top-bar { display:flex; justify-content:space-between; align-items:center; padding:12px 24px; background:#161b33; border-bottom:2px solid #e94560; position:sticky; top:0; z-index:100; }
.logo { font-size:22px; font-weight:bold; color:#e94560; letter-spacing:1px; }
.user-info { display:flex; gap:12px; align-items:center; font-size:14px; }
.balance-box { background:#0f3460; padding:6px 16px; border-radius:20px; color:#4ecca3; font-weight:bold; border:1px solid #4ecca3; }
.top-btn { background:#e94560; color:#fff; border:none; padding:8px 16px; border-radius:6px; cursor:pointer; font-size:13px; transition:.2s; }
.top-btn:hover { background:#c73e54; }
.top-btn.admin { background:#ffd700; color:#1a1a2e; display:none; }

.page { display:none; padding:20px; max-width:900px; margin:0 auto; animation:fadeIn .4s; }
.page.active { display:block; }
@keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

.auth-box { max-width:400px; margin:60px auto; background:#161b33; padding:40px; border-radius:16px; text-align:center; border:1px solid #2a3050; }
.auth-box h2 { margin-bottom:8px; color:#e94560; font-size:28px; }
.auth-box p { color:#888; margin-bottom:24px; font-size:13px; }
.tabs { display:flex; margin-bottom:20px; background:#0f3460; border-radius:8px; overflow:hidden; }
.tab { flex:1; padding:12px; background:transparent; border:none; color:#aaa; cursor:pointer; font-size:15px; transition:.2s; }
.tab.active { background:#e94560; color:#fff; font-weight:bold; }
.auth-box input { width:100%; padding:14px; margin:8px 0; border:none; border-radius:10px; background:#0f3460; color:#fff; font-size:15px; border:1px solid transparent; transition:.2s; }
.auth-box input:focus { outline:none; border-color:#e94560; }
.auth-box button[type="button"] { width:100%; padding:14px; margin-top:10px; border:none; border-radius:10px; background:#e94560; color:#fff; font-size:16px; cursor:pointer; font-weight:bold; transition:.2s; }
.auth-box button[type="button"]:hover { background:#ff6b81; }

.game-container { background:#161b33; padding:30px; border-radius:16px; border:1px solid #2a3050; margin-bottom:20px; }
.multiplier-display { font-size:80px; font-weight:bold; color:#4ecca3; text-align:center; margin:20px 0; text-shadow:0 0 30px rgba(78,204,163,.4); transition:color .2s; }
.road { position:relative; height:140px; background:#0f3460; border-radius:12px; margin:20px 0; overflow:hidden; border:2px solid #2a3050; }
.road-bg { position:absolute; inset:0; background:repeating-linear-gradient(90deg,transparent 0,transparent 40px,#1a1a2e 40px,#1a1a2e 42px); opacity:.3; }
.road-line { position:absolute; bottom:25px; left:0; right:0; height:4px; background:#e94560; border-radius:2px; }
.chicken { position:absolute; bottom:35px; left:5%; font-size:44px; transition:left .1s linear; filter:drop-shadow(0 4px 8px rgba(0,0,0,.5)); }
.game-status { text-align:center; color:#aaa; margin:10px 0; font-size:16px; min-height:24px; }

.controls { display:flex; gap:12px; justify-content:center; align-items:flex-end; margin-top:20px; flex-wrap:wrap; }
.bet-section { display:flex; flex-direction:column; align-items:flex-start; gap:6px; }
.bet-section label { font-size:13px; color:#aaa; }
.bet-section input { width:160px; padding:12px; border:none; border-radius:8px; background:#0f3460; color:#fff; font-size:16px; text-align:center; }
.game-btn { padding:14px 32px; border:none; border-radius:10px; font-size:16px; cursor:pointer; font-weight:bold; transition:.2s; min-width:140px; }
#betBtn { background:#e94560; color:#fff; }
#betBtn:hover:not(:disabled) { background:#ff6b81; }
#cashoutBtn { background:#4ecca3; color:#0d0d1a; display:none; }
#cashoutBtn:hover:not(:disabled) { background:#3db892; }
.game-btn:disabled { background:#333; color:#777; cursor:not-allowed; }

.wallet-section { background:#161b33; padding:24px; border-radius:16px; border:1px solid #2a3050; }
.wallet-section h3 { color:#4ecca3; margin-bottom:16px; font-size:18px; display:flex; align-items:center; gap:8px; }
.wallet-actions { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.wallet-actions input { width:180px; padding:12px; border:none; border-radius:8px; background:#0f3460; color:#fff; font-size:15px; }
.wallet-actions button { padding:12px 20px; border:none; border-radius:8px; background:#0f3460; color:#fff; border:1px solid #e94560; cursor:pointer; font-size:14px; transition:.2s; }
.wallet-actions button:hover { background:#e94560; }

.admin-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
.admin-header h2 { color:#ffd700; }
.admin-tabs { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
.admin-tabs button { padding:10px 20px; border:none; border-radius:8px; background:#0f3460; color:#fff; cursor:pointer; font-size:14px; transition:.2s; }
.admin-tabs button.active { background:#e94560; }
.admin-content { background:#161b33; border-radius:12px; overflow-x:auto; border:1px solid #2a3050; max-height:400px; overflow-y:auto; }
table { width:100%; border-collapse:collapse; font-size:14px; }
th, td { padding:12px; text-align:right; border-bottom:1px solid #2a3050; white-space:nowrap; }
th { color:#e94560; background:#0f3460; position:sticky; top:0; }
tr:hover { background:#1a1f3d; }
.admin-action { margin-top:24px; background:#161b33; padding:20px; border-radius:12px; border:1px solid #2a3050; }
.admin-action h4 { color:#ffd700; margin-bottom:12px; }
.admin-action input { width:160px; padding:12px; margin-left:8px; border:none; border-radius:8px; background:#0f3460; color:#fff; }
.admin-action button { margin-left:8px; padding:10px 18px; border:none; border-radius:8px; cursor:pointer; font-size:14px; }
.btn-add { background:#4ecca3; color:#0d0d1a; }
.btn-remove { background:#e94560; color:#fff; }

.toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:#161b33; color:#fff; padding:14px 28px; border-radius:10px; border:1px solid #e94560; box-shadow:0 10px 30px rgba(0,0,0,.5); z-index:999; animation:slideUp .3s; display:none; font-size:14px; }
@keyframes slideUp { from{opacity:0;transform:translate(-50%,20px)} to{opacity:1;transform:translate(-50%,0)} }

@media(max-width:600px){
  .multiplier-display{font-size:52px}
  .controls{flex-direction:column;align-items:center}
  .auth-box{padding:24px;margin:20px}
  .top-bar{flex-wrap:wrap;gap:8px}
}
</style>
</head>
<body>

<header class="top-bar">
  <div class="logo">🐔 Chicken Road</div>
  <div class="user-info" id="userInfo" style="display:none">
    <span id="usernameDisplay"></span>
    <span class="balance-box" id="balanceDisplay">0.00 $</span>
    <button class="top-btn" onclick="logout()">خروج</button>
    <button class="top-btn admin" id="adminBtn" onclick="showPage('adminPage')">⚙️ الإدارة</button>
  </div>
</header>

<div id="authPage" class="page active">
  <div class="auth-box">
    <h2>🐔 Chicken Road</h2>
    <p>لعبة الدجاجة - اربح قبل ما تكراش!</p>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">دخول</button>
      <button class="tab" onclick="switchTab('register')">تسجيل</button>
    </div>
    <div id="loginForm">
      <input type="text" id="loginUser" placeholder="اسم المستخدم">
      <input type="password" id="loginPass" placeholder="كلمة المرور">
      <button type="button" onclick="login()">دخول</button>
    </div>
    <div id="registerForm" style="display:none">
      <input type="text" id="regUser" placeholder="اسم المستخدم">
      <input type="password" id="regPass" placeholder="كلمة المرور">
      <button type="button" onclick="register()">تسجيل حساب</button>
    </div>
  </div>
</div>

<div id="gamePage" class="page">
  <div class="game-container">
    <div class="multiplier-display" id="multiplier">1.00x</div>
    <div class="road">
      <div class="road-bg"></div>
      <div class="road-line"></div>
      <div class="chicken" id="chicken">🐔</div>
    </div>
    <div class="game-status" id="gameStatus">انتظر الجولة القادمة...</div>
    
    <div class="controls">
      <div class="bet-section">
        <label>💰 مبلغ الرهان</label>
        <input type="number" id="betAmount" value="10" min="1" step="1">
      </div>
      <button class="game-btn" id="betBtn" onclick="placeBet()">🎯 ابدأ الرهان</button>
      <button class="game-btn" id="cashoutBtn" onclick="cashout()">💰 سحب الأرباح</button>
    </div>
  </div>

  <div class="wallet-section">
    <h3>💳 المحفظة</h3>
    <div class="wallet-actions">
      <input type="number" id="walletAmount" placeholder="المبلغ" min="1" step="1">
      <button onclick="transaction('deposit')">📥 إيداع</button>
      <button onclick="transaction('withdraw')">📤 سحب</button>
    </div>
  </div>
</div>

<div id="adminPage" class="page">
  <div class="admin-header">
    <h2>⚙️ لوحة الإدارة</h2>
    <button class="top-btn" onclick="showPage('gamePage')">⬅️ رجوع للعبة</button>
  </div>
  
  <div class="admin-tabs">
    <button onclick="loadAdminData('users')" class="active" id="tab-users">👥 المستخدمين</button>
    <button onclick="loadAdminData('bets')" id="tab-bets">🎰 الرهانات</button>
    <button onclick="loadAdminData('transactions')" id="tab-transactions">📋 التحويلات</button>
  </div>

  <div class="admin-content">
    <table id="adminTable"><tbody></tbody></table>
  </div>

  <div class="admin-action">
    <h4>🔧 تعديل رصيد مستخدم</h4>
    <input type="number" id="adminUserId" placeholder="ID المستخدم">
    <input type="number" id="adminAmount" placeholder="المبلغ" min="1">
    <button class="btn-add" onclick="adminAdjust('add')">➕ إضافة رصيد</button>
    <button class="btn-remove" onclick="adminAdjust('remove')">➖ خصم رصيد</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const DB = {
  getUsers() { return JSON.parse(localStorage.getItem('cr_users') || '[]'); },
  setUsers(u) { localStorage.setItem('cr_users', JSON.stringify(u)); },
  getBets() { return JSON.parse(localStorage.getItem('cr_bets') || '[]'); },
  setBets(b) { localStorage.setItem('cr_bets', JSON.stringify(b)); },
  getTrans() { return JSON.parse(localStorage.getItem('cr_trans') || '[]'); },
  setTrans(t) { localStorage.setItem('cr_trans', JSON.stringify(t)); },
  getCurrentUser() { return JSON.parse(localStorage.getItem('cr_current') || 'null'); },
  setCurrentUser(u) { localStorage.setItem('cr_current', JSON.stringify(u)); },
  init() {
    const users = this.getUsers();
    if (!users.find(u => u.username === 'admin')) {
      users.push({ id:1, username:'admin', password:'admin123', balance:999999, role:'admin', created_at:new Date().toLocaleString() });
      this.setUsers(users);
    }
  }
};
DB.init();

let currentUser = DB.getCurrentUser();
let gameActive = false;
let currentMultiplier = 1.0;
let betPlaced = false;
let currentBetAmount = 0;
let gameInterval;
let crashPoint = 0;
let nextId = () => Date.now() + Math.floor(Math.random()*1000);

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3000);
}

function login() {
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  if (!username || !password) return toast('أدخل اسم المستخدم وكلمة المرور');
  const user = DB.getUsers().find(u => u.username === username && u.password === password);
  if (!user) return toast('اسم المستخدم أو كلمة المرور غير صحيحة');
  currentUser = user;
  DB.setCurrentUser(user);
  initUser();
}

function register() {
  const username = document.getElementById('regUser').value.trim();
  const password = document.getElementById('regPass').value;
  if (!username || !password) return toast('أدخل جميع البيانات');
  if (username.length < 3) return toast('اسم المستخدم قصير جداً');
  const users = DB.getUsers();
  if (users.find(u => u.username === username)) return toast('اسم المستخدم موجود مسبقاً');
  const newUser = { id: nextId(), username, password, balance: 0, role: 'user', created_at: new Date().toLocaleString() };
  users.push(newUser);
  DB.setUsers(users);
  toast('تم التسجيل! سجل دخول الآن');
  switchTab('login');
}

function logout() {
  currentUser = null;
  DB.setCurrentUser(null);
  location.reload();
}

function initUser() {
  document.getElementById('usernameDisplay').textContent = currentUser.username;
  document.getElementById('balanceDisplay').textContent = currentUser.balance.toFixed(2) + ' $';
  document.getElementById('userInfo').style.display = 'flex';
  if (currentUser.role === 'admin') document.getElementById('adminBtn').style.display = 'inline-block';
  showPage('gamePage');
  startGameLoop();
}

function transaction(type) {
  const amount = parseFloat(document.getElementById('walletAmount').value);
  if (!amount || amount <= 0) return toast('أدخل مبلغ صحيح');
  const users = DB.getUsers();
  const idx = users.findIndex(u => u.id === currentUser.id);
  if (type === 'withdraw' && users[idx].balance < amount) return toast('رصيد غير كافٍ');
  
  if (type === 'deposit') users[idx].balance += amount;
  else users[idx].balance -= amount;
  
  DB.setUsers(users);
  currentUser = users[idx];
  DB.setCurrentUser(currentUser);
  document.getElementById('balanceDisplay').textContent = currentUser.balance.toFixed(2) + ' $';
  
  const trans = DB.getTrans();
  trans.push({ id: nextId(), user_id: currentUser.id, username: currentUser.username, type, amount, created_at: new Date().toLocaleString() });
  DB.setTrans(trans);
  
  toast(type === 'deposit' ? 'تم الإيداع بنجاح!' : 'تم السحب بنجاح!');
  document.getElementById('walletAmount').value = '';
}

function generateCrashPoint() {
  const r = Math.random();
  if (r < 0.02) return 1.00;
  if (r < 0.50) return 1.00 + Math.random() * 1.0;
  if (r < 0.80) return 2.00 + Math.random() * 1.5;
  return 3.50 + Math.random() * 5.0;
}

function placeBet() {
  if (gameActive || betPlaced) return;
  const amount = parseFloat(document.getElementById('betAmount').value);
  if (!amount || amount <= 0) return toast('أدخل مبلغ رهان');
  if (currentUser.balance < amount) return toast('رصيد غير كافٍ للرهان');
  
  const users = DB.getUsers();
  const idx = users.findIndex(u => u.id === currentUser.id);
  users[idx].balance -= amount;
  DB.setUsers(users);
  currentUser = users[idx];
  DB.setCurrentUser(currentUser);
  document.getElementById('balanceDisplay').textContent = currentUser.balance.toFixed(2) + ' $';
  
  currentBetAmount = amount;
  betPlaced = true;
  document.getElementById('betBtn').style.display = 'none';
  document.getElementById('cashoutBtn').style.display = 'inline-block';
  document.getElementById('cashoutBtn').disabled = false;
  document.getElementById('gameStatus').textContent = '🔴 الرهان مباشر! اضغط سحب قبل الكراش...';
}

function cashout() {
  if (!gameActive || !betPlaced) return;
  const profit = currentBetAmount * (currentMultiplier - 1);
  const totalReturn = currentBetAmount + profit;
  
  const users = DB.getUsers();
  const idx = users.findIndex(u => u.id === currentUser.id);
  users[idx].balance += totalReturn;
  DB.setUsers(users);
  currentUser = users[idx];
  DB.setCurrentUser(currentUser);
  document.getElementById('balanceDisplay').textContent = currentUser.balance.toFixed(2) + ' $';
  
  const bets = DB.getBets();
  bets.push({ id: nextId(), user_id: currentUser.id, username: currentUser.username, amount: currentBetAmount, multiplier: crashPoint, cashout_multiplier: currentMultiplier, profit: profit, result: 'win', created_at: new Date().toLocaleString() });
  DB.setBets(bets);
  
  endGame(true, totalReturn);
}

function startGameLoop() {
  let countdown = 3;
  document.getElementById('gameStatus').textContent = `الجولة تبدأ بعد ${countdown}...`;
  document.getElementById('multiplier').textContent = '1.00x';
  document.getElementById('multiplier').style.color = '#4ecca3';
  document.getElementById('chicken').style.left = '5%';
  document.getElementById('betBtn').style.display = 'inline-block';
  document.getElementById('betBtn').disabled = true;
  document.getElementById('cashoutBtn').style.display = 'none';
  
  const cd = setInterval(() => {
    countdown--;
    if (countdown > 0) {
      document.getElementById('gameStatus').textContent = `الجولة تبدأ بعد ${countdown}...`;
    } else {
      clearInterval(cd);
      startRound();
    }
  }, 1000);
}

function startRound() {
  gameActive = true;
  currentMultiplier = 1.00;
  crashPoint = generateCrashPoint();
  betPlaced = false;
  
  document.getElementById('betBtn').disabled = false;
  document.getElementById('cashoutBtn').disabled = true;
  document.getElementById('gameStatus').textContent = '🔴 الجولة جارية!';
  
  const startTime = Date.now();
  const multEl = document.getElementById('multiplier');
  const chickEl = document.getElementById('chicken');
  
  gameInterval = setInterval(() => {
    const elapsed = (Date.now() - startTime) / 1000;
    currentMultiplier = parseFloat((1 + elapsed * 0.4 + elapsed * elapsed * 0.05).toFixed(2));
    const pos = 5 + Math.min((currentMultiplier - 1) / (crashPoint - 1) * 85, 90);
    
    multEl.textContent = currentMultiplier.toFixed(2) + 'x';
    chickEl.style.left = pos + '%';
    
    if (currentMultiplier >= crashPoint) {
      clearInterval(gameInterval);
      if (betPlaced) {
        const bets = DB.getBets();
        bets.push({ id: nextId(), user_id: currentUser.id, username: currentUser.username, amount: currentBetAmount, multiplier: crashPoint, cashout_multiplier: 0, profit: 0, result: 'loss', created_at: new Date().toLocaleString() });
        DB.setBets(bets);
        endGame(false, 0);
      } else {
        endGame(false, 0, true);
      }
    }
  }, 80);
}

function endGame(win, amount, noBet = false) {
  gameActive = false;
  clearInterval(gameInterval);
  document.getElementById('betBtn').style.display = 'inline-block';
  document.getElementById('betBtn').disabled = true;
  document.getElementById('cashoutBtn').style.display = 'none';
  
  if (noBet) {
    document.getElementById('gameStatus').textContent = '⚪ لم تراهن هذه الجولة';
  } else if (win) {
    document.getElementById('gameStatus').textContent = `🎉 ربحت ${amount.toFixed(2)} $!`;
    document.getElementById('multiplier').style.color = '#ffd700';
    toast(`🎉 ربحت ${amount.toFixed(2)} $!`);
  } else {
    document.getElementById('gameStatus').textContent = '💥 كراش! خسرت الرهان';
    document.getElementById('multiplier').style.color = '#e94560';
    toast('💥 كراش! خسرت الرهان');
  }
  setTimeout(startGameLoop, 2500);
}

function loadAdminData(type) {
  document.querySelectorAll('.admin-tabs button').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + type).classList.add('active');
  
  let html = '<thead><tr>';
  if (type === 'users') {
    html += '<th>ID</th><th>المستخدم</th><th>الرصيد</th><th>الصلاحية</th><th>التاريخ</th></tr></thead><tbody>';
    DB.getUsers().forEach(u => {
      html += `<tr><td>${u.id}</td><td>${u.username}</td><td>${u.balance.toFixed(2)}</td><td>${u.role}</td><td>${u.created_at}</td></tr>`;
    });
  } else if (type === 'bets') {
    html += '<th>ID</th><th>المستخدم</th><th>الرهان</th><th>كراش</th><th>سحب</th><th>الربح</th><th>النتيجة</th></tr></thead><tbody>';
    DB.getBets().slice().reverse().forEach(b => {
      const color = b.result === 'win' ? 'color:#4ecca3' : 'color:#e94560';
      html += `<tr><td>${b.id}</td><td>${b.username}</td><td>${b.amount}</td><td>${b.multiplier?.toFixed(2)}x</td><td>${b.cashout_multiplier?.toFixed(2)}x</td><td style="${color}">${b.profit.toFixed(2)}</td><td style="${color}">${b.result === 'win' ? '✅ ربح' : '❌ خسارة'}</td></tr>`;
    });
  } else {
    html += '<th>ID</th><th>المستخدم</th><th>النوع</th><th>المبلغ</th><th>التاريخ</th></tr></thead><tbody>';
    DB.getTrans().slice().reverse().forEach(t => {
      html += `<tr><td>${t.id}</td><td>${t.username}</td><td>${t.type === 'deposit' ? 'إيداع' : t.type === 'withdraw' ? 'سحب' : t.type}</td><td>${t.amount}</td><td>${t.created_at}</td></tr>`;
    });
  }
  html += '</tbody>';
  document.getElementById('adminTable').innerHTML = html;
}

function adminAdjust(type) {
  const userId = parseInt(document.getElementById('adminUserId').value);
  const amount = parseFloat(document.getElementById('adminAmount').value);
  if (!userId || !amount || amount <= 0) return toast('أدخل ID والمبلغ بشكل صحيح');
  
  const users = DB.getUsers();
  const idx = users.findIndex(u => u.id == userId);
  if (idx === -1) return toast('المستخدم غير موجود');
  
  if (type === 'add') users[idx].balance += amount;
  else {
    if (users[idx].balance < amount) return toast('رصيد المستخدم غير كافٍ للخصم');
    users[idx].balance -= amount;
  }
  DB.setUsers(users);
  
  const trans = DB.getTrans();
  trans.push({ id: nextId(), user_id: users[idx].id, username: users[idx].username, type: type === 'add' ? 'admin_deposit' : 'admin_withdraw', amount, created_at: new Date().toLocaleString() });
  DB.setTrans(trans);
  
  toast(type === 'add' ? 'تم إضافة الرصيد!' : 'تم خصم الرصيد!');
  loadAdminData('users');
  document.getElementById('adminUserId').value = '';
  document.getElementById('adminAmount').value = '';
}

if (currentUser) initUser();
</script>
</body>
</html>
