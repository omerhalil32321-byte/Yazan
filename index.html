<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chicken Road - طريق الدجاجة</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Titan+One&family=Inter:wght@400;600;700&display=swap');

* { margin:0; padding:0; box-sizing:border-box; }
html, body { 
  width:100%; height:100%; overflow:hidden;
  font-family:'Inter',sans-serif; 
  background:#1a1a2e; 
  color:#fff; 
}

/* ===== شريط علوي ===== */
.top-bar { 
  display:flex; justify-content:space-between; align-items:center; 
  padding:8px 16px; background:#0d0d1a; 
  border-bottom:2px solid #e94560; 
  position:fixed; top:0; left:0; right:0; z-index:1000;
  height:50px;
}
.logo { 
  font-family:'Titan One',cursive; font-size:20px; color:#ffd700;
  text-shadow:2px 2px 0 #e94560;
}
.logo span { color:#e94560; }
.user-info { display:flex; gap:8px; align-items:center; font-size:12px; }
.balance-box { 
  background:linear-gradient(135deg,#ffd700,#ffaa00); 
  padding:5px 12px; border-radius:15px; 
  color:#1a1a2e; font-weight:bold; font-size:13px;
}
.top-btn { 
  background:#e94560; color:#fff; border:none; 
  padding:6px 12px; border-radius:6px; cursor:pointer; 
  font-size:11px; font-weight:600;
}
.top-btn:hover { background:#ff6b81; }
.top-btn.admin { 
  background:linear-gradient(135deg,#ffd700,#ffaa00); 
  color:#1a1a2e; display:none; font-weight:bold;
}

/* ===== الصفحات ===== */
.page { display:none; width:100%; height:100%; padding-top:50px; }
.page.active { display:block; }

/* ===== تسجيل الدخول ===== */
.auth-box { 
  max-width:360px; margin:60px auto; 
  background:linear-gradient(180deg,#1a1a3e,#0d0d1a); 
  padding:30px; border-radius:16px; text-align:center; 
  border:2px solid #ffd700;
  box-shadow:0 10px 40px rgba(0,0,0,.5);
}
.auth-box .game-logo { 
  font-family:'Titan One',cursive; font-size:32px; color:#ffd700;
  text-shadow:3px 3px 0 #e94560; margin-bottom:5px;
}
.auth-box .game-logo span { color:#e94560; }
.auth-box p { color:#aaa; margin-bottom:20px; font-size:12px; }
.tabs { display:flex; margin-bottom:15px; background:#0d0d1a; border-radius:8px; overflow:hidden; border:1px solid #2a3050; }
.tab { flex:1; padding:10px; background:transparent; border:none; color:#aaa; cursor:pointer; font-size:13px; font-weight:600; }
.tab.active { background:linear-gradient(135deg,#e94560,#ff6b81); color:#fff; }
.auth-box input { width:100%; padding:12px; margin:6px 0; border:none; border-radius:8px; background:#0d0d1a; color:#fff; font-size:14px; border:2px solid #2a3050; }
.auth-box input:focus { outline:none; border-color:#ffd700; }
.auth-box button[type="button"] { 
  width:100%; padding:12px; margin-top:10px; border:none; border-radius:8px;
  background:linear-gradient(135deg,#e94560,#ff6b81); color:#fff;
  font-size:15px; cursor:pointer; font-weight:bold;
}

/* ===== اختيار الصعوبة ===== */
.difficulty-select { 
  max-width:700px; margin:30px auto; 
  background:linear-gradient(180deg,#1a1a3e,#0d0d1a); 
  padding:25px; border-radius:16px; border:2px solid #2a3050;
}
.difficulty-select h3 { 
  font-family:'Titan One',cursive; color:#ffd700; 
  margin-bottom:15px; font-size:20px; text-align:center;
}
.diff-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:15px 0; }
@media(max-width:600px){ .diff-grid{grid-template-columns:repeat(2,1fr)} }
.diff-card { 
  background:#0d0d1a; padding:15px; border-radius:12px; 
  border:2px solid #2a3050; cursor:pointer; transition:.3s; text-align:center;
}
.diff-card:hover { border-color:#e94560; transform:translateY(-3px); }
.diff-card.selected { border-color:#4ecca3; background:#1a2f1a; }
.diff-card h4 { color:#fff; margin-bottom:6px; font-size:15px; }
.diff-card .steps { color:#aaa; font-size:11px; }
.diff-card .risk { color:#e94560; font-size:11px; font-weight:700; }
.diff-card .max-win { color:#4ecca3; font-size:11px; margin-top:4px; }

.bet-area { display:flex; gap:10px; justify-content:center; align-items:center; margin:15px 0; }
.bet-area label { color:#aaa; font-size:13px; }
.bet-area input { width:120px; padding:10px; border:none; border-radius:8px; background:#0d0d1a; color:#fff; font-size:16px; text-align:center; border:2px solid #2a3050; }
.play-btn { 
  display:block; margin:15px auto 0;
  background:linear-gradient(135deg,#4ecca3,#3db892); 
  color:#0d0d1a; border:none; padding:14px 40px; border-radius:12px;
  font-size:18px; font-weight:800; cursor:pointer;
  font-family:'Titan One',cursive; letter-spacing:1px;
}
.play-btn:disabled { background:#333; color:#555; cursor:not-allowed; }

/* ===== منطقة اللعب العمودية ===== */
.game-wrapper { 
  position:relative; width:100%; height:calc(100vh - 50px);
  overflow:hidden; background:#2d4a22;
}

/* الكاميرا/العالم */
.game-world { 
  position:absolute; top:0; left:0; width:100%;
  transition:transform .6s cubic-bezier(.25,.46,.45,.94);
}

/* المشهد */
.scene { 
  position:relative; width:100%; display:flex; flex-direction:column;
}

/* الرصيف */
.sidewalk { 
  width:100%; height:100px; 
  background:linear-gradient(90deg,#6a6a7e,#5a5a6e);
  display:flex; align-items:center; justify-content:center;
  border-bottom:4px solid #ffd700;
  position:relative; flex-shrink:0;
}
.sidewalk-start { border-bottom:4px solid #4ecca3; }
.sidewalk-end { border-top:4px solid #ffd700; border-bottom:none; }
.sidewalk-icon { font-size:40px; filter:drop-shadow(0 4px 8px rgba(0,0,0,.5)); }
.sidewalk-label { 
  position:absolute; left:20px; font-size:14px; color:#fff;
  font-weight:700; text-shadow:0 2px 4px rgba(0,0,0,.5);
}

/* الطريق */
.road { 
  width:100%; height:120px; 
  background:#4a4a5e;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  flex-shrink:0;
  border-bottom:2px dashed rgba(255,255,255,.15);
}
.road::before {
  content:''; position:absolute; top:50%; left:0; right:0; height:4px;
  background:repeating-linear-gradient(90deg,transparent 0,transparent 20px,rgba(255,255,255,.3) 20px,rgba(255,255,255,.3) 40px);
  transform:translateY(-50%);
}

/* المسارات */
.lane { 
  position:absolute; top:0; bottom:0; width:33.33%;
  border-left:2px dashed rgba(255,255,255,.15);
}
.lane:nth-child(1) { left:0; border-left:none; }
.lane:nth-child(2) { left:33.33%; }
.lane:nth-child(3) { left:66.66%; }

/* المضاعف الظاهر */
.coin-spot { 
  position:absolute; width:60px; height:60px; 
  border-radius:50%; 
  display:flex; align-items:center; justify-content:center;
  font-size:14px; font-weight:700; color:#1a1a2e;
  transition:all .3s;
  z-index:10;
  right:20px;
  top:50%;
  transform:translateY(-50%);
}
.coin-spot.safe { 
  background:linear-gradient(135deg,#ffd700,#ffaa00); 
  border:3px solid #fff;
  box-shadow:0 0 15px rgba(255,215,0,.4),0 4px 10px rgba(0,0,0,.3);
}
.coin-spot.car { 
  background:linear-gradient(135deg,#e94560,#ff1744); 
  border:3px solid #fff;
  font-size:28px;
  box-shadow:0 0 20px rgba(233,69,96,.5);
}
.coin-spot.current { 
  border-color:#4ecca3; 
  box-shadow:0 0 25px rgba(78,204,163,.6);
  transform:translateY(-50%) scale(1.15);
  z-index:20;
}

/* ===== الدجاجة الكاملة (SVG) ===== */
.chicken-wrapper {
  position:absolute;
  width:60px; height:60px;
  z-index:30;
  transition:all .5s cubic-bezier(.34,1.56,.64,1);
  display:flex;
  align-items:center;
  justify-content:center;
  left:50%;
  transform:translateX(-50%);
  bottom:20px;
}
.chicken-wrapper.walk {
  animation:chickenBounce .4s infinite alternate;
}
@keyframes chickenBounce {
  0%{transform:translateX(-50%) rotate(-3deg)}
  100%{transform:translateX(-50%) rotate(3deg) translateY(-8px)}
}
.chicken-wrapper.dead {
  animation:chickenCrash .8s forwards;
}
@keyframes chickenCrash {
  0%{transform:translateX(-50%) scale(1) rotate(0); filter:brightness(1)}
  20%{transform:translateX(-50%) scale(1.2) rotate(-15deg); filter:brightness(2)}
  40%{transform:translateX(-50%) scale(0.9) rotate(30deg); filter:brightness(1)}
  60%{transform:translateX(-50%) scale(1.1) rotate(-20deg) translateY(-20px)}
  80%{transform:translateX(-50%) scale(0.7) rotate(180deg) translateY(30px); opacity:0.8}
  100%{transform:translateX(-50%) scale(0) rotate(360deg) translateY(60px); opacity:0}
}
.chicken-wrapper.win {
  animation:chickenVictory .6s infinite alternate;
}
@keyframes chickenVictory {
  0%{transform:translateX(-50%) translateY(0) scale(1)}
  100%{transform:translateX(-50%) translateY(-20px) scale(1.15)}
}

/* ===== السيارات الأفقية المتحركة ===== */
.moving-car {
  position:absolute;
  font-size:35px;
  z-index:25;
  filter:drop-shadow(0 3px 6px rgba(0,0,0,.4));
  top:50%;
  transform:translateY(-50%);
}
.moving-car.driving {
  animation:carDrive 2s linear infinite;
}
@keyframes carDrive {
  0%{transform:translateY(-50%) translateX(-300px)}
  100%{transform:translateY(-50%) translateX(300px)}
}
.moving-car.crashing {
  animation:carCrashAnim .5s forwards;
}
@keyframes carCrashAnim {
  0%{transform:translateY(-50%) scale(1)}
  50%{transform:translateY(-50%) scale(1.3) rotate(-10deg)}
  100%{transform:translateY(-50%) scale(1.1) rotate(5deg)}
}

/* تأثير الاصطدام */
.crash-effect {
  position:absolute;
  width:100px; height:100px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,100,0,.8) 0%, rgba(255,0,0,.4) 50%, transparent 70%);
  z-index:35;
  animation:crashExpand .6s forwards;
  pointer-events:none;
  left:50%;
  top:50%;
  transform:translate(-50%, -50%);
}
@keyframes crashExpand {
  0%{transform:translate(-50%, -50%) scale(0); opacity:1}
  100%{transform:translate(-50%, -50%) scale(3); opacity:0}
}

/* ريش متناثر */
.feather {
  position:absolute;
  font-size:20px;
  z-index:36;
  animation:featherFly 1s forwards;
  pointer-events:none;
}
@keyframes featherFly {
  0%{transform:translate(0,0) rotate(0); opacity:1}
  100%{transform:translate(var(--tx), var(--ty)) rotate(var(--rot)); opacity:0}
}

/* اهتزاز الشاشة */
.screen-shake {
  animation:shake .5s cubic-bezier(.36,.07,.19,.97) both;
}
@keyframes shake {
  10%, 90%{transform:translate3d(-2px,0,0)}
  20%, 80%{transform:translate3d(4px,0,0)}
  30%, 50%, 70%{transform:translate3d(-6px,0,0)}
  40%, 60%{transform:translate3d(6px,0,0)}
}

/* الحواجز */
.barrier { 
  position:absolute; left:0; right:0; height:14px;
  background:repeating-linear-gradient(90deg,#ffd700 0,#ffd700 12px,#1a1a2e 12px,#1a1a2e 24px);
  border:2px solid #ffaa00; border-radius:7px;
  z-index:15;
}

/* المضاعف العائم */
.float-mult { 
  position:fixed; top:70px; left:50%; transform:translateX(-50%);
  background:linear-gradient(135deg,#1a1a3e,#0d0d1a);
  padding:10px 30px; border-radius:15px;
  border:2px solid #4ecca3;
  box-shadow:0 5px 20px rgba(0,0,0,.5);
  z-index:100;
  text-align:center;
}
.float-mult .value { 
  font-family:'Titan One',cursive; font-size:36px; color:#4ecca3;
  text-shadow:0 0 20px rgba(78,204,163,.3);
}
.float-mult .label { color:#aaa; font-size:11px; margin-top:2px; }
.float-mult.crash { border-color:#e94560; }
.float-mult.crash .value { color:#e94560; }
.float-mult.win { border-color:#ffd700; }
.float-mult.win .value { color:#ffd700; }

/* شريط التحكم السفلي */
.control-bar { 
  position:fixed; bottom:0; left:0; right:0;
  display:grid; grid-template-columns:1fr 1fr; gap:10px;
  padding:12px 16px; background:#0d0d1a;
  border-top:2px solid #3a3a5e; z-index:100;
}
.control-left { display:flex; flex-direction:column; gap:6px; }
.control-left .bet-row { display:flex; gap:6px; align-items:center; }
.control-left .bet-row label { color:#aaa; font-size:11px; }
.control-left .bet-row input { 
  flex:1; padding:8px; border:none; border-radius:6px;
  background:#1a1a2e; color:#fff; font-size:13px; border:1px solid #2a3050;
}
.diff-btns { display:flex; gap:4px; }
.diff-btns button { 
  flex:1; padding:6px; border:1px solid #2a3050; border-radius:6px;
  background:#1a1a2e; color:#aaa; cursor:pointer; font-size:10px; font-weight:600;
}
.diff-btns button.active { 
  background:linear-gradient(135deg,#e94560,#ff6b81); color:#fff; border-color:#e94560;
}

.control-right { display:flex; flex-direction:column; gap:6px; }
.cashout-display { 
  background:linear-gradient(135deg,#ffd700,#ffaa00); 
  padding:8px; border-radius:8px; text-align:center; color:#1a1a2e;
}
.cashout-display .label { font-size:10px; font-weight:700; }
.cashout-display .value { font-size:16px; font-weight:800; }
.action-btns { display:flex; gap:6px; }
.go-btn { 
  flex:1; padding:12px; border:none; border-radius:8px;
  background:linear-gradient(135deg,#4ecca3,#3db892); color:#0d0d1a;
  font-size:16px; font-weight:800; cursor:pointer;
  font-family:'Titan One',cursive;
}
.go-btn:disabled { background:#333; color:#555; cursor:not-allowed; }
.cashout-btn { 
  flex:1; padding:12px; border:none; border-radius:8px;
  background:linear-gradient(135deg,#ffd700,#ffaa00); color:#1a1a2e;
  font-size:14px; font-weight:800; cursor:pointer;
}
.cashout-btn:disabled { background:#333; color:#555; cursor:not-allowed; }

/* المحفظة */
.wallet-panel { 
  position:fixed; right:10px; top:60px;
  background:linear-gradient(180deg,#1a1a3e,#0d0d1a);
  padding:12px; border-radius:12px; border:2px solid #2a3050;
  width:180px; z-index:50;
}
.wallet-panel h4 { color:#ffd700; font-size:12px; margin-bottom:8px; font-family:'Titan One',cursive; }
.wallet-panel input { width:100%; padding:8px; margin-bottom:6px; border:none; border-radius:6px; background:#0d0d1a; color:#fff; font-size:12px; border:1px solid #2a3050; }
.wallet-panel button { width:100%; padding:8px; margin-bottom:4px; border:none; border-radius:6px; background:linear-gradient(135deg,#e94560,#ff6b81); color:#fff; cursor:pointer; font-size:12px; font-weight:600; }

/* Toast */
.toast { 
  position:fixed; bottom:100px; left:50%; transform:translateX(-50%);
  background:linear-gradient(135deg,#1a1a3e,#0d0d1a);
  color:#fff; padding:12px 24px; border-radius:10px;
  border:2px solid #ffd700; box-shadow:0 10px 30px rgba(0,0,0,.5);
  z-index:999; display:none; font-size:13px; font-weight:600;
}

/* الإدارة */
.admin-page { padding:60px 20px 20px; max-width:900px; margin:0 auto; }
.admin-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; }
.admin-header h2 { font-family:'Titan One',cursive; color:#ffd700; }
.admin-tabs { display:flex; gap:6px; margin-bottom:12px; }
.admin-tabs button { padding:8px 16px; border:1px solid #2a3050; border-radius:8px; background:#1a1a2e; color:#aaa; cursor:pointer; font-size:12px; font-weight:600; }
.admin-tabs button.active { background:linear-gradient(135deg,#e94560,#ff6b81); color:#fff; border-color:#e94560; }
.admin-content { background:#0d0d1a; border-radius:10px; overflow-x:auto; border:1px solid #2a3050; max-height:350px; overflow-y:auto; }
table { width:100%; border-collapse:collapse; font-size:12px; }
th, td { padding:10px; text-align:right; border-bottom:1px solid #2a3050; }
th { color:#ffd700; background:#1a1a2e; position:sticky; top:0; }
.admin-action { margin-top:15px; background:#1a1a2e; padding:15px; border-radius:12px; border:2px solid #2a3050; }
.admin-action h4 { color:#ffd700; margin-bottom:10px; font-family:'Titan One',cursive; }
.admin-action input { width:140px; padding:10px; margin-left:6px; border:none; border-radius:8px; background:#0d0d1a; color:#fff; border:1px solid #2a3050; }
.admin-action button { margin-left:6px; padding:8px 14px; border:none; border-radius:8px; cursor:pointer; font-size:12px; font-weight:600; }
.btn-add { background:linear-gradient(135deg,#4ecca3,#3db892); color:#0d0d1a; }
.btn-remove { background:linear-gradient(135deg,#e94560,#ff6b81); color:#fff; }

/* Responsive */
@media(max-width:600px){
  .float-mult .value{font-size:28px}
  .coin-spot{width:50px;height:50px;font-size:12px}
  .chicken-wrapper{width:50px;height:50px}
  .road{height:100px}
  .sidewalk{height:80px}
  .wallet-panel{width:150px;right:5px;top:55px}
  .wallet-panel h4{font-size:10px}
}
</style>

<body>

<header class="top-bar">
  <div class="logo">CHICKEN<span>ROAD</span></div>
  <div class="user-info" id="userInfo" style="display:none">
    <span id="usernameDisplay"></span>
    <span class="balance-box" id="balanceDisplay">0.00 $</span>
    <button class="top-btn" onclick="logout()">خروج</button>
    <button class="top-btn admin" id="adminBtn" onclick="showPage('adminPage')">⚙️</button>
  </div>
</header>

<!-- تسجيل الدخول -->
<div id="authPage" class="page active">
  <div style="display:flex;align-items:center;justify-content:center;height:100vh;padding-top:50px">
    <div class="auth-box">
      <div class="game-logo">CHICKEN<span>ROAD</span></div>
      <p>🐔 ساعد الدجاجة تعبر الطريق!</p>
      <div class="tabs">
        <button class="tab active" onclick="switchTab('login')">دخول</button>
        <button class="tab" onclick="switchTab('register')">تسجيل</button>
      </div>
      <div id="loginForm">
        <input type="text" id="loginUser" placeholder="اسم المستخدم">
        <input type="password" id="loginPass" placeholder="كلمة المرور">
        <button type="button" onclick="login()">🎮 دخول</button>
      </div>
      <div id="registerForm" style="display:none">
        <input type="text" id="regUser" placeholder="اسم المستخدم">
        <input type="password" id="regPass" placeholder="كلمة المرور">
        <button type="button" onclick="register()">📝 تسجيل</button>
      </div>
    </div>
  </div>
</div>

<!-- صفحة اللعبة -->
<div id="gamePage" class="page">

  <!-- اختيار الصعوبة -->
  <div id="difficultySelect" style="padding:20px">
    <div class="difficulty-select">
      <h3>🎮 اختر مستوى الصعوبة</h3>
      <div class="diff-grid">
        <div class="diff-card" data-diff="easy" onclick="selectDiff('easy')">
          <h4>🟢 سهل</h4>
          <div class="steps">24 خطوة</div>
          <div class="risk">خطر: 4%</div>
          <div class="max-win">x24.50</div>
        </div>
        <div class="diff-card" data-diff="medium" onclick="selectDiff('medium')">
          <h4>🟡 متوسط</h4>
          <div class="steps">22 خطوة</div>
          <div class="risk">خطر: 12%</div>
          <div class="max-win">x2,254</div>
        </div>
        <div class="diff-card" data-diff="hard" onclick="selectDiff('hard')">
          <h4>🔴 صعب</h4>
          <div class="steps">20 خطوة</div>
          <div class="risk">خطر: 20%</div>
          <div class="max-win">x52,067</div>
        </div>
        <div class="diff-card" data-diff="hardcore" onclick="selectDiff('hardcore')">
          <h4>⚫ هاردكور</h4>
          <div class="steps">15 خطوة</div>
          <div class="risk">خطر: 40%</div>
          <div class="max-win">x3,203,384</div>
        </div>
      </div>
      <div class="bet-area">
        <label>💰 الرهان:</label>
        <input type="number" id="betAmount" value="10" min="1" step="1">
      </div>
      <button class="play-btn" id="startBtn" onclick="startGame()" disabled>▶ PLAY</button>
    </div>
  </div>

  <!-- منطقة اللعب العمودية -->
  <div id="playArea" style="display:none">
    <div class="game-wrapper" id="gameWrapper">
      <div class="game-world" id="gameWorld">
        <div class="scene" id="scene"></div>
      </div>
    </div>

    <!-- المضاعف العائم -->
    <div class="float-mult" id="floatMult">
      <div class="value" id="multValue">1.00x</div>
      <div class="label" id="multLabel">اضغط GO</div>
    </div>

    <!-- المحفظة -->
    <div class="wallet-panel" id="walletPanel">
      <h4>💳 المحفظة</h4>
      <input type="number" id="walletAmount" placeholder="المبلغ" min="1">
      <button onclick="transaction('deposit')">📥 إيداع</button>
      <button onclick="transaction('withdraw')">📤 سحب</button>
      <button onclick="resetGame()" style="background:linear-gradient(135deg,#666,#444);margin-top:6px">🔄 لعبة جديدة</button>
    </div>

    <!-- شريط التحكم -->
    <div class="control-bar">
      <div class="control-left">
        <div class="bet-row">
          <label>الرهان:</label>
          <input type="number" id="gameBetAmount" value="10" readonly>
        </div>
        <div class="diff-btns" id="diffBtns">
          <button data-d="easy" onclick="changeDiff('easy')">سهل</button>
          <button data-d="medium" onclick="changeDiff('medium')">متوسط</button>
          <button data-d="hard" onclick="changeDiff('hard')">صعب</button>
          <button data-d="hardcore" onclick="changeDiff('hardcore')">هارد</button>
        </div>
      </div>
      <div class="control-right">
        <div class="cashout-display">
          <div class="label">CASH OUT</div>
          <div class="value" id="cashoutValue">0.00 USD</div>
        </div>
        <div class="action-btns">
          <button class="go-btn" id="goBtn" onclick="makeStep()">GO</button>
          <button class="cashout-btn" id="cashoutBtn2" onclick="cashoutGame()" disabled>CASH OUT</button>
        </div>
      </div>
    </div>
  </div>
</div>

  <div class="admin-page">
    <div class="admin-header">
      <h2>⚙️ الإدارة</h2>
      <button class="top-btn" onclick="showPage('gamePage')">⬅️ رجوع</button>

      <button onclick="loadAdminData('users')" class="active" id="tab-users">👥 المستخدمين</button>
      <button onclick="loadAdminData('bets')" id="tab-bets">🎰 الرهانات</button>
      <button onclick="loadAdminData('transactions')" id="tab-transactions">📋 التحويلات</button>
    </div>

      <table id="adminTable"><tbody></tbody></table>
    </div>

      <h4>🔧 تعديل رصيد</h4>
      <input type="number" id="adminUserId" placeholder="ID">
      <input type="number" id="adminAmount" placeholder="المبلغ" min="1">

      <button class="btn-remove" onclick="adminAdjust('remove')">➖ خصم</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ==================== قاعدة البيانات ====================
const DB = {
  getUsers() { return JSON.parse(localStorage.getItem('cr_users') || '[]'); },
  setUsers(u) { localStorage.setItem('cr_users', JSON.stringify(u)); },
  getBets() { return JSON.parse(localStorage.getItem('cr_bets') || '[]'); },
  setBets(b) { localStorage.setItem('cr_bets', JSON.stringify(b)); },
  getTrans() { return JSON.parse(localStorage.getItem('cr_trans') || '[]'); },
  setTrans(t) { localStorage.setItem('cr_trans', JSON.stringify(t)); },
  getCurrentUser() { return JSON.parse(localStorage.getItem('cr_current') || 'null'); },
  setCurrentUser(u) { localStorage.setItem('cr_current', JSON.stringify(u)); },
  init() {
    const users = this.getUsers();
    if (!users.find(u => u.username === 'admin')) {
      users.push({ id:1, username:'admin', password:'admin123', balance:999999, role:'admin', created_at:new Date().toLocaleString() });
      this.setUsers(users);
    }
  }
};
DB.init();

const DIFFICULTY = {
  easy:     { name:'سهل',     steps:24, risk:0.04, startMult:1.03, base:1.15, maxMult:24.50 },
  medium:   { name:'متوسط',   steps:22, risk:0.12, startMult:1.12, base:1.42, maxMult:2254 },
  hard:     { name:'صعب',     steps:20, risk:0.20, startMult:1.23, base:1.68, maxMult:52067 },
  hardcore: { name:'هاردكور', steps:15, risk:0.40, startMult:1.63, base:2.85, maxMult:3203384 }
};

let currentUser = DB.getCurrentUser();
let selectedDiff = null;
let gamePath = [];
let gameMults = [];
let currentStep = -1;
let currentBet = 0;
let gameActive = false;
let carIntervals = [];
let nextId = () => Date.now() + Math.floor(Math.random()*1000);

// ==================== تنقل ====================
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3000);
}

// ==================== مصادقة ====================
function login() {
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  if (!username || !password) return toast('أدخل اسم المستخدم وكلمة المرور');
  const user = DB.getUsers().find(u => u.username === username && u.password === password);
  if (!user) return toast('بيانات غير صحيحة');
  currentUser = user;
  DB.setCurrentUser(user);
  initUser();
}
function register() {
  const username = document.getElementById('regUser').value.trim();
  const password = document.getElementById('regPass').value;
  if (!username || !password) return toast('أدخل جميع البيانات');
  if (username.length < 3) return toast('اسم المستخدم قصير');
  const users = DB.getUsers();
  if (users.find(u => u.username === username)) return toast('الاسم موجود');
  const newUser = { id: nextId(), username, password, balance: 0, role: 'user', created_at: new Date().toLocaleString() };
  users.push(newUser);
  DB.setUsers(users);
  toast('تم التسجيل!');
  switchTab('login');
}
function logout() {
  currentUser = null;
  DB.setCurrentUser(null);
  location.reload();
}
function initUser() {
  document.getElementById('usernameDisplay').textContent = currentUser.username;
  document.getElementById('balanceDisplay').textContent = currentUser.balance.toFixed(2) + ' $';
  document.getElementById('userInfo').style.display = 'flex';
  if (currentUser.role === 'admin') document.getElementById('adminBtn').style.display = 'inline-block';
  showPage('gamePage');
}

// ==================== محفظة ====================
function transaction(type) {
  const amount = parseFloat(document.getElementById('walletAmount').value);
  if (!amount || amount <= 0) return toast('أدخل مبلغ صحيح');
  const users = DB.getUsers();
  const idx = users.findIndex(u => u.id === currentUser.id);
  if (type === 'withdraw' && users[idx].balance < amount) return toast('رصيد غير كافٍ');

  if (type === 'deposit') users[idx].balance += amount;
  else users[idx].balance -= amount;

  DB.setUsers(users);
  currentUser = users[idx];
  DB.setCurrentUser(currentUser);
  document.getElementById('balanceDisplay').textContent = currentUser.balance.toFixed(2) + ' $';

  const trans = DB.getTrans();
  trans.push({ id: nextId(), user_id: currentUser.id, username: currentUser.username, type, amount, created_at: new Date().toLocaleString() });
  DB.setTrans(trans);

  toast(type === 'deposit' ? 'تم الإيداع!' : 'تم السحب!');
  document.getElementById('walletAmount').value = '';
}

// ==================== الدجاجة الكاملة (SVG) ====================
function getChickenSVG() {
  return `<svg viewBox="0 0 80 80" width="55" height="55">
    <!-- جسم -->
    <ellipse cx="40" cy="45" rx="22" ry="20" fill="#fff" stroke="#ddd" stroke-width="1"/>
    <!-- رأس -->
    <circle cx="40" cy="22" r="14" fill="#fff" stroke="#ddd" stroke-width="1"/>
    <!-- تاج -->
    <path d="M32 12 L36 4 L40 10 L44 4 L48 12" fill="#e94560" stroke="#c73e54" stroke-width="1"/>
    <!-- منقار -->
    <ellipse cx="40" cy="26" rx="6" ry="4" fill="#ffd700" stroke="#ffaa00" stroke-width="1"/>
    <!-- عين -->
    <circle cx="36" cy="18" r="3" fill="#1a1a2e"/>
    <circle cx="37" cy="17" r="1" fill="#fff"/>
    <!-- عين ثانية -->
    <circle cx="44" cy="18" r="3" fill="#1a1a2e"/>
    <circle cx="45" cy="17" r="1" fill="#fff"/>

    <ellipse cx="28" cy="42" rx="8" ry="12" fill="#f0f0f0" stroke="#ddd" stroke-width="1" transform="rotate(-20 28 42)"/>

    <line x1="34" y1="62" x2="34" y2="72" stroke="#ffaa00" stroke-width="3" stroke-linecap="round"/>
    <line x1="46" y1="62" x2="46" y2="72" stroke="#ffaa00" stroke-width="3" stroke-linecap="round"/>
    <!-- قدم -->

    <ellipse cx="46" cy="74" rx="5" ry="3" fill="#ffaa00"/>

function getDeadChickenSVG() {
  return `<svg viewBox="0 0 80 80" width="45" height="45" style="transform:rotate(180deg)">
    <ellipse cx="40" cy="50" rx="20" ry="15" fill="#ccc" stroke="#999" stroke-width="1"/>
    <circle cx="40" cy="30" r="12" fill="#ccc" stroke="#999" stroke-width="1"/>
    <path d="M34 22 L38 16 L42 22" fill="#999"/>
    <ellipse cx="40" cy="32" rx="5" ry="3" fill="#999"/>
    <circle cx="36" cy="26" r="2" fill="#666"/>
    <circle cx="44" cy="26" r="2" fill="#666"/>
    <line x1="35" y1="62" x2="35" y2="70" stroke="#999" stroke-width="2"/>
    <line x1="45" y1="62" x2="45" y2="70" stroke="#999" stroke-width="2"/>
    <text x="40" y="45" text-anchor="middle" font-size="20">💀</text>
  </svg>`;
}

// ==================== اللعبة العمودية ====================
function selectDiff(diff) {
  selectedDiff = diff;
  document.querySelectorAll('.diff-card').forEach(c => c.classList.remove('selected'));
  document.querySelector(`.diff-card[data-diff="${diff}"]`).classList.add('selected');
  document.getElementById('startBtn').disabled = false;
}

function changeDiff(diff) {
  if (gameActive) return toast('لا يمكن التغيير أثناء اللعبة');
  selectedDiff = diff;
  document.querySelectorAll('.diff-btns button').forEach(b => b.classList.remove('active'));
  document.querySelector(`.diff-btns button[data-d="${diff}"]`).classList.add('active');
}

function generatePath(diff) {
  const { steps, risk } = DIFFICULTY[diff];
  const path = [];
  for (let i = 0; i < steps; i++) path.push(Math.random() < risk ? 'car' : 'safe');
  if (path.every(p => p === 'car')) path[steps - 1] = 'safe';
  return path;
}

function generateMultipliers(diff) {
  const { steps, startMult, base, maxMult } = DIFFICULTY[diff];
  const mults = [];
  for (let i = 0; i < steps; i++) {
    let val = startMult * Math.pow(base, i);
    if (i === steps - 1) val = maxMult;
    else if (val > maxMult) val = maxMult;
    mults.push(parseFloat(val.toFixed(2)));
  }
  return mults;
}

function startGame() {
  if (!selectedDiff) return toast('اختر الصعوبة');
  const bet = parseFloat(document.getElementById('betAmount').value);
  if (!bet || bet <= 0) return toast('أدخل الرهان');
  if (currentUser.balance < bet) return toast('رصيد غير كافٍ');

  const users = DB.getUsers();
  const idx = users.findIndex(u => u.id === currentUser.id);
  users[idx].balance -= bet;
  DB.setUsers(users);
  currentUser = users[idx];
  DB.setCurrentUser(currentUser);
  document.getElementById('balanceDisplay').textContent = currentUser.balance.toFixed(2) + ' $';

  currentBet = bet;
  gamePath = generatePath(selectedDiff);
  gameMults = generateMultipliers(selectedDiff);
  currentStep = -1;
  gameActive = true;
  carIntervals = [];

  document.getElementById('difficultySelect').style.display = 'none';
  document.getElementById('playArea').style.display = 'block';
  document.getElementById('gameBetAmount').value = bet;

  document.querySelectorAll('.diff-btns button').forEach(b => b.classList.remove('active'));
  document.querySelector(`.diff-btns button[data-d="${selectedDiff}"]`).classList.add('active');

  buildScene();
  startMovingCars();
  updateCamera();
  updateGameInfo();
  document.getElementById('goBtn').disabled = false;
  document.getElementById('cashoutBtn2').disabled = true;
  document.getElementById('multLabel').textContent = 'اضغط GO للتقدم';
  document.getElementById('floatMult').className = 'float-mult';
}

function buildScene() {
  const scene = document.getElementById('scene');
  const steps = DIFFICULTY[selectedDiff].steps;
  const roadHeight = 120;
  const sidewalkHeight = 100;

  let html = '';

  // رصيف البداية (في الأسفل)
  html += `
    <div class="sidewalk sidewalk-start" style="height:${sidewalkHeight}px">
      <div class="sidewalk-icon">🏠</div>
      <div class="sidewalk-label">بداية</div>
    </div>
  `;

  // الحاجز الأول
  html += `<div style="width:100%;height:30px;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0"><div class="barrier" style="position:absolute;left:10%;right:10%;top:50%;height:8px;transform:translateY(-50%)"></div></div>`;

  // الطرق والمضاعفات
  for (let i = 0; i < steps; i++) {
    html += `
      <div class="road" style="height:${roadHeight}px" id="road-${i}">
        <div class="lane" style="left:0"></div>
        <div class="lane" style="left:33.33%"></div>
        <div class="lane" style="left:66.66%"></div>
        <div class="coin-spot safe" id="coin-${i}">
          <div style="font-size:13px">${gameMults[i].toFixed(2)}x</div>
        </div>
      </div>
    `;

    if (i < steps - 1) {
      html += `<div style="width:100%;height:20px;background:#2d4a22;flex-shrink:0"></div>`;
    }
  }

  // الحاجز الأخير
  html += `<div style="width:100%;height:30px;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0"><div class="barrier" style="position:absolute;left:10%;right:10%;top:50%;height:8px;transform:translateY(-50%)"></div></div>`;

  // رصيف النهاية (في الأعلى)
  html += `
    <div class="sidewalk sidewalk-end" style="height:${sidewalkHeight}px">
      <div class="sidewalk-icon">🏆</div>
      <div class="sidewalk-label">نهاية</div>
    </div>
  `;

  scene.innerHTML = html;

  // إضافة الدجاجة في رصيف البداية
  const startSidewalk = document.querySelector('.sidewalk-start');
  if (startSidewalk) {
    const chicken = document.createElement('div');
    chicken.className = 'chicken-wrapper';
    chicken.id = 'activeChicken';
    chicken.innerHTML = getChickenSVG();
    startSidewalk.appendChild(chicken);
  }
}

// ==================== سيارات متحركة أفقية ====================
function startMovingCars() {
  const steps = DIFFICULTY[selectedDiff].steps;

  for (let i = 0; i < steps; i++) {
    const road = document.getElementById(`road-${i}`);
    if (!road) continue;

    // سيارات عشوائية تتحرك أفقياً على المسارات
    const numCars = Math.floor(Math.random() * 2) + 1;
    for (let c = 0; c < numCars; c++) {
      createMovingCar(road, i);
    }
  }
}

function createMovingCar(road, roadIndex) {
  const lanePositions = ['15%', '50%', '85%'];
  const laneIdx = Math.floor(Math.random() * 3);
  const topPos = lanePositions[laneIdx];
  const carTypes = ['🚗', '🚙', '🚕', '🚓', '🚐'];
  const carType = carTypes[Math.floor(Math.random() * carTypes.length)];
  const speed = 2 + Math.random() * 3;
  const direction = Math.random() > 0.5 ? 1 : -1;

  const car = document.createElement('div');
  car.className = 'moving-car';
  car.innerHTML = carType;
  car.style.top = topPos;
  car.style.transform = 'translateY(-50%)';
  car.style.left = direction > 0 ? '-50px' : 'calc(100% + 50px)';
  car.dataset.direction = direction;
  car.dataset.speed = speed;
  car.dataset.roadIndex = roadIndex;
  road.appendChild(car);

  // تحريك السيارة أفقياً
  let pos = direction > 0 ? -50 : road.offsetWidth + 50;
  const interval = setInterval(() => {
    if (!gameActive && currentStep >= roadIndex) {
      clearInterval(interval);
      car.remove();
      return;
    }
    pos += speed * direction;
    car.style.left = pos + 'px';

    const roadWidth = road.offsetWidth;
    if ((direction > 0 && pos > roadWidth + 50) || (direction < 0 && pos < -50)) {
      pos = direction > 0 ? -50 : roadWidth + 50;
    }
  }, 30);

  carIntervals.push(interval);
}

function updateCamera() {
  const world = document.getElementById('gameWorld');
  const wrapper = document.getElementById('gameWrapper');
  const wrapperHeight = wrapper.offsetHeight;

  let chickenY = 0;
  if (currentStep >= 0) {
    const road = document.getElementById(`road-${currentStep}`);
    if (road) {
      const roadRect = road.getBoundingClientRect();
      const worldRect = world.getBoundingClientRect();
      chickenY = roadRect.top - worldRect.top + roadRect.height / 2;
    }
  } else {
    const startSidewalk = document.querySelector('.sidewalk-start');
    if (startSidewalk) {
      const rect = startSidewalk.getBoundingClientRect();
      const worldRect = world.getBoundingClientRect();
      chickenY = rect.top - worldRect.top + rect.height / 2;
    }
  }

  const offset = wrapperHeight / 2 - chickenY;
  world.style.transform = `translateY(${offset}px)`;
}

function updateGameInfo() {
  if (currentStep === -1) {
    document.getElementById('multValue').textContent = '1.00x';
    document.getElementById('cashoutValue').textContent = '0.00 USD';
  } else {
    const mult = gameMults[currentStep];
    document.getElementById('multValue').textContent = mult.toFixed(2) + 'x';
    document.getElementById('cashoutValue').textContent = (currentBet * mult).toFixed(2) + ' USD';
  }
}

function makeStep() {
  if (!gameActive) return;

  currentStep++;
  const diff = DIFFICULTY[selectedDiff];

  if (currentStep >= diff.steps) {
    winGame(diff.maxMult);
    return;
  }

  const isCar = gamePath[currentStep] === 'car';

  // تحديث المضاعف السابق
  if (currentStep > 0) {
    const prevCoin = document.getElementById(`coin-${currentStep - 1}`);
    if (prevCoin) {
      prevCoin.classList.remove('current');
      prevCoin.classList.add('safe');
    }
  }

  // تحديث المضاعف الحالي
  const currentCoin = document.getElementById(`coin-${currentStep}`);
  if (currentCoin) {
    currentCoin.classList.add('current');
  }

  // نقل الدجاجة إلى الطريق الحالي
  const chicken = document.getElementById('activeChicken');
  const targetRoad = document.getElementById(`road-${currentStep}`);
  if (chicken && targetRoad) {
    targetRoad.appendChild(chicken);
    chicken.classList.add('walk');
    setTimeout(() => chicken.classList.remove('walk'), 500);
  }

  setTimeout(updateCamera, 50);

  if (isCar) {
    // إظهار السيارة والاصطدام
    if (currentCoin) {
      currentCoin.classList.remove('current');
      currentCoin.classList.add('car');
      currentCoin.innerHTML = '🚗';
    }
    setTimeout(() => crashEffect(), 300);
  } else {
    updateGameInfo();
    document.getElementById('multLabel').textContent = '✅ آمن! تقدم أو اسحب...';
    document.getElementById('multLabel').style.color = '#4ecca3';
    document.getElementById('cashoutBtn2').disabled = false;

    if (currentStep === diff.steps - 1) {
      document.getElementById('multLabel').textContent = '🏁 الأخيرة! اسحب الآن!';
      document.getElementById('goBtn').disabled = true;
    }
  }
}

// ==================== اصطدام حقيقي ====================
function crashEffect() {
  const chicken = document.getElementById('activeChicken');
  const road = document.getElementById(`road-${currentStep}`);

  if (!chicken || !road) {
    loseGame();
    return;
  }

  // إيقاف السيارات
  carIntervals.forEach(interval => clearInterval(interval));
  carIntervals = [];

  // إزالة السيارات المتحركة في هذا الطريق
  const movingCars = road.querySelectorAll('.moving-car');
  movingCars.forEach(car => {
    car.classList.add('crashing');
  });

  // تأثير الاصطدام
  const crash = document.createElement('div');
  crash.className = 'crash-effect';
  road.appendChild(crash);

  // ريش متناثر
  for (let i = 0; i < 8; i++) {
    const feather = document.createElement('div');
    feather.className = 'feather';
    feather.innerHTML = '🪶';
    feather.style.left = '50%';
    feather.style.top = '50%';
    feather.style.setProperty('--tx', (Math.random() * 200 - 100) + 'px');
    feather.style.setProperty('--ty', (Math.random() * 200 - 100) + 'px');
    feather.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
    road.appendChild(feather);
  }

  // اهتزاز الشاشة
  document.body.classList.add('screen-shake');
  setTimeout(() => document.body.classList.remove('screen-shake'), 500);

  // تغيير الدجاجة لميتة
  chicken.innerHTML = getDeadChickenSVG();
  chicken.classList.add('dead');

  setTimeout(() => loseGame(), 800);
}

function cashoutGame() {
  if (!gameActive || currentStep < 0) return;
  const mult = gameMults[currentStep];
  winGame(mult);
}

function winGame(mult) {
  gameActive = false;
  carIntervals.forEach(interval => clearInterval(interval));
  carIntervals = [];

  const winAmount = currentBet * mult;

  const users = DB.getUsers();
  const idx = users.findIndex(u => u.id === currentUser.id);
  users[idx].balance += winAmount;
  DB.setUsers(users);
  currentUser = users[idx];
  DB.setCurrentUser(currentUser);
  document.getElementById('balanceDisplay').textContent = currentUser.balance.toFixed(2) + ' $';

  const bets = DB.getBets();
  bets.push({
    id: nextId(), user_id: currentUser.id, username: currentUser.username,
    amount: currentBet, difficulty: selectedDiff, multiplier: mult,
    steps_taken: currentStep + 1, profit: winAmount - currentBet,
    result: 'win', created_at: new Date().toLocaleString()
  });
  DB.setBets(bets);

  document.getElementById('multValue').textContent = mult.toFixed(2) + 'x';
  document.getElementById('floatMult').className = 'float-mult win';
  document.getElementById('multLabel').textContent = `🎉 فزت بـ ${winAmount.toFixed(2)} $!`;
  document.getElementById('multLabel').style.color = '#ffd700';
  document.getElementById('goBtn').disabled = true;
  document.getElementById('cashoutBtn2').disabled = true;

  const chicken = document.getElementById('activeChicken');
  if (chicken) {
    chicken.classList.remove('walk');
    chicken.classList.add('win');
  }

  toast(`🎉 ربحت ${winAmount.toFixed(2)} $!`);
}

function loseGame() {
  gameActive = false;
  carIntervals.forEach(interval => clearInterval(interval));
  carIntervals = [];

  const bets = DB.getBets();
  bets.push({
    id: nextId(), user_id: currentUser.id, username: currentUser.username,
    amount: currentBet, difficulty: selectedDiff, multiplier: 0,
    steps_taken: currentStep + 1, profit: -currentBet,
    result: 'loss', created_at: new Date().toLocaleString()
  });
  DB.setBets(bets);

  document.getElementById('multValue').textContent = '💥';
  document.getElementById('floatMult').className = 'float-mult crash';
  document.getElementById('multLabel').textContent = '🚗💨 دهست!';
  document.getElementById('multLabel').style.color = '#e94560';
  document.getElementById('goBtn').disabled = true;
  document.getElementById('cashoutBtn2').disabled = true;

  toast('🚗💨 الدجاجة في الجنة!');
}

function resetGame() {
  // إيقاف كل السيارات
  carIntervals.forEach(interval => clearInterval(interval));
  carIntervals = [];

  document.getElementById('difficultySelect').style.display = 'block';
  document.getElementById('playArea').style.display = 'none';
  document.getElementById('floatMult').className = 'float-mult';
  selectedDiff = null;
  document.querySelectorAll('.diff-card').forEach(c => c.classList.remove('selected'));
  document.getElementById('startBtn').disabled = true;
}

// ==================== إدارة ====================
function loadAdminData(type) {
  document.querySelectorAll('.admin-tabs button').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + type).classList.add('active');

  let html = '<thead><tr>';
  if (type === 'users') {
    html += '<th>ID</th><th>المستخدم</th><th>الرصيد</th><th>الصلاحية</th><th>التاريخ</th></tr></thead><tbody>';
    DB.getUsers().forEach(u => {
      html += `<tr><td>${u.id}</td><td>${u.username}</td><td>${u.balance.toFixed(2)}</td><td>${u.role}</td><td>${u.created_at}</td></tr>`;
    });
  } else if (type === 'bets') {
    html += '<th>ID</th><th>المستخدم</th><th>الرهان</th><th>الصعوبة</th><th>المضاعف</th><th>الخطوات</th><th>الربح</th><th>النتيجة</th></tr></thead><tbody>';
    DB.getBets().slice().reverse().forEach(b => {
      const diffName = DIFFICULTY[b.difficulty]?.name || b.difficulty;
      const color = b.result === 'win' ? 'color:#4ecca3' : 'color:#e94560';
      html += `<tr><td>${b.id}</td><td>${b.username}</td><td>${b.amount}</td><td>${diffName}</td><td>${b.multiplier?.toFixed(2)}x</td><td>${b.steps_taken}</td><td style="${color}">${b.profit.toFixed(2)}</td><td style="${color}">${b.result === 'win' ? '✅' : '❌'}</td></tr>`;
    });
  } else {
    html += '<th>ID</th><th>المستخدم</th><th>النوع</th><th>المبلغ</th><th>التاريخ</th></tr></thead><tbody>';
    DB.getTrans().slice().reverse().forEach(t => {
      const typeName = t.type === 'deposit' ? 'إيداع' : t.type === 'withdraw' ? 'سحب' : t.type === 'admin_deposit' ? 'إضافة' : 'خصم';
      html += `<tr><td>${t.id}</td><td>${t.username}</td><td>${typeName}</td><td>${t.amount}</td><td>${t.created_at}</td></tr>`;
    });
  }
  html += '</tbody>';
  document.getElementById('adminTable').innerHTML = html;
}

function adminAdjust(type) {
  const userId = parseInt(document.getElementById('adminUserId').value);
  const amount = parseFloat(document.getElementById('adminAmount').value);
  if (!userId || !amount || amount <= 0) return toast('أدخل البيانات');

  const users = DB.getUsers();
  const idx = users.findIndex(u => u.id == userId);
  if (idx === -1) return toast('غير موجود');

  if (type === 'add') users[idx].balance += amount;
  else {
    if (users[idx].balance < amount) return toast('رصيد غير كافٍ');
    users[idx].balance -= amount;
  }
  DB.setUsers(users);

  const trans = DB.getTrans();
  trans.push({ id: nextId(), user_id: users[idx].id, username: users[idx].username, type: type === 'add' ? 'admin_deposit' : 'admin_withdraw', amount, created_at: new Date().toLocaleString() });
  DB.setTrans(trans);

  toast(type === 'add' ? 'تم!' : 'تم الخصم!');
  loadAdminData('users');
  document.getElementById('adminUserId').value = '';
  document.getElementById('adminAmount').value = '';
}

if (currentUser) initUser();
</script>
